<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="100%" height="100%">
  <style>
    .card { fill: #ffffff; stroke: #000000; stroke-width: 2.5; rx: 12px; }
    .title { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 28px; font-weight: 500; letter-spacing: 2px; text-anchor: middle; fill: #000000; }
    .caption { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 600; letter-spacing: 1.5px; text-anchor: middle; fill: #000000; }
    .node { fill: #000000; filter: drop-shadow(0px 2px 3px rgba(0,0,0,0.3)); }
    .edge { stroke: #000000; stroke-width: 0.9; opacity: 0.75; }
    .bbox { fill: none; stroke: #000000; stroke-width: 1.5; }
    .label-bg { fill: #000000; }
    .label-txt { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 9px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
    .cam-body { fill: #ffffff; stroke: #000000; stroke-width: 2; }
    .frustum { fill: rgba(0,0,0,0.05); stroke: #000000; stroke-width: 1.2; stroke-dasharray: 4,4; }
    .frustum-solid { stroke: #000000; stroke-width: 1.5; fill: rgba(0,0,0,0.08); }
  </style>

  <!-- CARD 1: NEURAL NETWORK -->
  <g transform="translate(15, 15)">
    <rect class="card" x="0" y="0" width="470" height="470" rx="12"/>
    <text x="235" y="55" class="title">NEURAL NETWORK</text>

    <!-- Neural Network Graph -->
    <!-- Layers x coords: L1:80, L2:155, L3:235, L4:315, L5:390 -->
    <!-- Edges -->
    <!-- L1 to L2 -->
    <path class="edge" d="
      M80,140 L155,110 M80,140 L155,160 M80,140 L155,210 M80,140 L155,260 M80,140 L155,310 M80,140 L155,360
      M80,190 L155,110 M80,190 L155,160 M80,190 L155,210 M80,190 L155,260 M80,190 L155,310 M80,190 L155,360
      M80,240 L155,110 M80,240 L155,160 M80,240 L155,210 M80,240 L155,260 M80,240 L155,310 M80,240 L155,360
      M80,290 L155,110 M80,290 L155,160 M80,290 L155,210 M80,290 L155,260 M80,290 L155,310 M80,290 L155,360
      M80,340 L155,110 M80,340 L155,160 M80,340 L155,210 M80,340 L155,260 M80,340 L155,310 M80,340 L155,360
    "/>
    <!-- L2 to L3 -->
    <path class="edge" d="
      M155,110 L235,90 M155,110 L235,140 M155,110 L235,190 M155,110 L235,240 M155,110 L235,290 M155,110 L235,340 M155,110 L235,390
      M155,160 L235,90 M155,160 L235,140 M155,160 L235,190 M155,160 L235,240 M155,160 L235,290 M155,160 L235,340 M155,160 L235,390
      M155,210 L235,90 M155,210 L235,140 M155,210 L235,190 M155,210 L235,240 M155,210 L235,290 M155,210 L235,340 M155,210 L235,390
      M155,260 L235,90 M155,260 L235,140 M155,260 L235,190 M155,260 L235,240 M155,260 L235,290 M155,260 L235,340 M155,260 L235,390
      M155,310 L235,90 M155,310 L235,140 M155,310 L235,190 M155,310 L235,240 M155,310 L235,290 M155,310 L235,340 M155,310 L235,390
      M155,360 L235,90 M155,360 L235,140 M155,360 L235,190 M155,360 L235,240 M155,360 L235,290 M155,360 L235,340 M155,360 L235,390
    "/>
    <!-- L3 to L4 -->
    <path class="edge" d="
      M235,90 L315,110 M235,90 L315,160 M235,90 L315,210 M235,90 L315,260 M235,90 L315,310 M235,90 L315,360
      M235,140 L315,110 M235,140 L315,160 M235,140 L315,210 M235,140 L315,260 M235,140 L315,310 M235,140 L315,360
      M235,190 L315,110 M235,190 L315,160 M235,190 L315,210 M235,190 L315,260 M235,190 L315,310 M235,190 L315,360
      M235,240 L315,110 M235,240 L315,160 M235,240 L315,210 M235,240 L315,260 M235,240 L315,310 M235,240 L315,360
      M235,290 L315,110 M235,290 L315,160 M235,290 L315,210 M235,290 L315,310 M235,290 L315,360 M235,290 L315,360
      M235,340 L315,110 M235,340 L315,160 M235,340 L315,210 M235,340 L315,260 M235,340 L315,310 M235,340 L315,360
      M235,390 L315,110 M235,390 L315,160 M235,390 L315,210 M235,390 L315,260 M235,390 L315,310 M235,390 L315,360
    "/>
    <!-- L4 to L5 -->
    <path class="edge" d="
      M315,110 L390,140 M315,110 L390,190 M315,110 L390,240 M315,110 L390,290 M315,110 L390,340
      M315,160 L390,140 M315,160 L390,190 M315,160 L390,240 M315,160 L390,290 M315,160 L390,340
      M315,210 L390,140 M315,210 L390,190 M315,210 L390,240 M315,210 L390,290 M315,210 L390,340
      M315,260 L390,140 M315,260 L390,190 M315,260 L390,240 M315,260 L390,290 M315,260 L390,340
      M315,310 L390,140 M315,310 L390,190 M315,310 L390,240 M315,310 L390,290 M315,310 L390,340
      M315,360 L390,140 M315,360 L390,190 M315,360 L390,240 M315,360 L390,290 M315,360 L390,340
    "/>

    <!-- Nodes Layer 1 (5 nodes) -->
    <circle cx="80" cy="140" r="11" class="node"/><circle cx="80" cy="190" r="11" class="node"/>
    <circle cx="80" cy="240" r="11" class="node"/><circle cx="80" cy="290" r="11" class="node"/>
    <circle cx="80" cy="340" r="11" class="node"/>

    <!-- Nodes Layer 2 (6 nodes) -->
    <circle cx="155" cy="110" r="11" class="node"/><circle cx="155" cy="160" r="11" class="node"/>
    <circle cx="155" cy="210" r="11" class="node"/><circle cx="155" cy="260" r="11" class="node"/>
    <circle cx="155" cy="310" r="11" class="node"/><circle cx="155" cy="360" r="11" class="node"/>

    <!-- Nodes Layer 3 (7 nodes) -->
    <circle cx="235" cy="90" r="11" class="node"/><circle cx="235" cy="140" r="11" class="node"/>
    <circle cx="235" cy="190" r="11" class="node"/><circle cx="235" cy="240" r="11" class="node"/>
    <circle cx="235" cy="290" r="11" class="node"/><circle cx="235" cy="340" r="11" class="node"/>
    <circle cx="235" cy="390" r="11" class="node"/>

    <!-- Nodes Layer 4 (6 nodes) -->
    <circle cx="315" cy="110" r="11" class="node"/><circle cx="315" cy="160" r="11" class="node"/>
    <circle cx="315" cy="210" r="11" class="node"/><circle cx="315" cy="260" r="11" class="node"/>
    <circle cx="315" cy="310" r="11" class="node"/><circle cx="315" cy="360" r="11" class="node"/>

    <!-- Nodes Layer 5 (5 nodes) -->
    <circle cx="390" cy="140" r="11" class="node"/><circle cx="390" cy="190" r="11" class="node"/>
    <circle cx="390" cy="240" r="11" class="node"/><circle cx="390" cy="290" r="11" class="node"/>
    <circle cx="390" cy="340" r="11" class="node"/>

    <text x="235" y="440" class="caption">NETWORK STRUCTURE AND DATA FLOW</text>
  </g>

  <!-- CARD 2: COMPUTER VISION -->
  <g transform="translate(515, 15)">
    <rect class="card" x="0" y="0" width="470" height="470" rx="12"/>
    <text x="235" y="55" class="title">COMPUTER VISION</text>

    <!-- Camera Body & Lens -->
    <g transform="translate(30, 180)">
      <rect x="0" y="20" width="16" height="70" class="cam-body"/>
      <rect x="16" y="10" width="24" height="90" class="cam-body"/>
      <path d="M40 0 L100 25 L100 75 L40 100 Z" class="cam-body"/>
      <ellipse cx="40" cy="50" rx="6" ry="45" fill="none" stroke="#000000" stroke-width="2"/>
      <ellipse cx="70" cy="50" rx="8" ry="35" fill="none" stroke="#000000" stroke-width="2"/>
      <ellipse cx="90" cy="50" rx="6" ry="28" fill="none" stroke="#000000" stroke-width="2"/>
    </g>

    <!-- 3D Frustum Projection Cone -->
    <polygon points="130,230 380,100 440,160 440,360 380,380 130,230" class="frustum-solid"/>
    <line x1="380" y1="100" x2="380" y2="380" stroke="#000000" stroke-width="1.5"/>
    <line x1="380" y1="380" x2="440" y2="360" stroke="#000000" stroke-width="1.5"/>
    <line x1="380" y1="100" x2="440" y2="160" stroke="#000000" stroke-width="1.5"/>

    <!-- Detected Objects inside bounding boxes -->
    <!-- Tree Object -->
    <g transform="translate(390, 110)">
      <rect class="bbox" x="0" y="0" width="40" height="60"/>
      <rect class="label-bg" x="0" y="-12" width="28" height="12"/>
      <text x="14" y="-3" class="label-txt">TREE</text>
      <!-- Tree sketch -->
      <path d="M20,55 L20,35 M20,35 Q10,25 20,10 Q30,25 20,35" fill="none" stroke="#000" stroke-width="1.5"/>
    </g>

    <!-- Car Object -->
    <g transform="translate(340, 200)">
      <rect class="bbox" x="0" y="0" width="55" height="35"/>
      <rect class="label-bg" x="0" y="-12" width="24" height="12"/>
      <text x="12" y="-3" class="label-txt">CAR</text>
      <!-- Car sketch -->
      <path d="M5,28 L50,28 M12,28 Q18,15 30,15 Q40,15 45,28" fill="none" stroke="#000" stroke-width="1.5"/>
      <circle cx="16" cy="28" r="4" fill="#000"/><circle cx="40" cy="28" r="4" fill="#000"/>
    </g>

    <!-- Person Object 1 -->
    <g transform="translate(330, 280)">
      <rect class="bbox" x="0" y="0" width="28" height="55"/>
      <rect class="label-bg" x="0" y="-12" width="38" height="12"/>
      <text x="19" y="-3" class="label-txt">PERSON</text>
      <!-- Person stick figure -->
      <circle cx="14" cy="12" r="5" fill="#000"/>
      <line x1="14" y1="17" x2="14" y2="35" stroke="#000" stroke-width="2.5"/>
      <line x1="14" y1="24" x2="6" y2="32" stroke="#000" stroke-width="2"/>
      <line x1="14" y1="24" x2="22" y2="32" stroke="#000" stroke-width="2"/>
      <line x1="14" y1="35" x2="8" y2="50" stroke="#000" stroke-width="2"/>
      <line x1="14" y1="35" x2="20" y2="50" stroke="#000" stroke-width="2"/>
    </g>

    <!-- Person Object 2 -->
    <g transform="translate(400, 240)">
      <rect class="bbox" x="0" y="0" width="24" height="48"/>
      <rect class="label-bg" x="0" y="-12" width="38" height="12"/>
      <text x="19" y="-3" class="label-txt">PERSON</text>
      <!-- Person figure -->
      <circle cx="12" cy="10" r="4" fill="#000"/>
      <line x1="12" y1="14" x2="12" y2="30" stroke="#000" stroke-width="2"/>
      <line x1="12" y1="30" x2="7" y2="44" stroke="#000" stroke-width="2"/>
      <line x1="12" y1="30" x2="17" y2="44" stroke="#000" stroke-width="2"/>
    </g>

    <!-- Sign Stop -->
    <g transform="translate(425, 200)">
      <rect class="bbox" x="-10" y="0" width="30" height="70"/>
      <rect class="label-bg" x="-10" y="-12" width="24" height="12"/>
      <text x="2" y="-3" class="label-txt">SIGN</text>
      <line x1="5" y1="0" x2="5" y2="70" stroke="#000" stroke-width="2"/>
      <polygon points="5,5 -5,15 -5,30 5,40 15,30 15,15" fill="#fff" stroke="#000" stroke-width="1.5"/>
      <text x="5" y="25" font-family="'Helvetica Neue', Helvetica, sans-serif" font-size="6" font-weight="bold" text-anchor="middle">STOP</text>
    </g>

    <text x="235" y="440" class="caption">OBJECT DETECTION AND CLASSIFICATION</text>
  </g>
</svg>
